
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi imagen</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: white;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        #error {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

    <img id="imagen" style="display: none;" alt="Imagen">

    <div id="error" style="display: none;">
        No se ha encontrado ninguna imagen.
    </div>

    <script>
        const usuario = "woobiegoobie";
        const repositorio = "woobiegoobie.github.io";
        const carpeta = "papa";

        async function cargarImagenMasReciente() {

            try {
                const commitsURL =
                    `https://api.github.com/repos/${usuario}/${repositorio}/commits?path=${carpeta}&per_page=100`;

                const commitsResponse = await fetch(commitsURL);

                if (!commitsResponse.ok) {
                    throw new Error("No se pudieron obtener los commits");
                }

                const commits = await commitsResponse.json();

                for (const commit of commits) {

                    const commitURL =
                        `https://api.github.com/repos/${usuario}/${repositorio}/commits/${commit.sha}`;

                    const commitResponse = await fetch(commitURL);

                    if (!commitResponse.ok) {
                        continue;
                    }

                    const datosCommit = await commitResponse.json();

                    if (!datosCommit.files) {
                        continue;
                    }

                    const imagenes = datosCommit.files.filter(file => {
                        const nombre = file.filename.toLowerCase();

                        return (
                            file.filename.startsWith(carpeta + "/") &&
                            /\.(jpg|jpeg|png|gif|webp)$/i.test(nombre) &&
                            (file.status === "added" || file.status === "modified")
                        );
                    });

                    if (imagenes.length > 0) {

                        const archivo = imagenes[imagenes.length - 1];

                        const urlImagen =
                            `https://raw.githubusercontent.com/${usuario}/${repositorio}/main/${archivo.filename}`;

                        document.getElementById("imagen").src = urlImagen;
                        document.getElementById("imagen").style.display = "block";

                        return;
                    }
                }

                throw new Error("No se encontró ninguna imagen");

            } catch (error) {

                console.error(error);

                document.getElementById("error").style.display = "block";
            }
        }

        cargarImagenMasReciente();
    </script>

</body>
</html>
